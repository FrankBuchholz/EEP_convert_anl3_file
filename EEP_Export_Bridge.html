<style>

<body>

<main>
  <section class="medium"><h2 data-t="ZeitWetter"></h2><div id="gl">–</div></section>
  <section class="wide"><h2><span data-t="Züge"></span> <small>
    <span data-t="Folgen"></span>: <select id="follow"><option value="" data-t="kein Zug"></option></select></small></h2><div id="trains"></div></section>
    <section class="medium"><h2><span data-t="Signale"></span> <small id="sigNote"></small></h2><div id="sigs"></div></section>

<script>
"use strict";
// Hilfsfunktion: Element per ID holen
const $ = id => document.getElementById(id);

// BroadcastChannel für Kommunikation mit Gleisplan
const live = new BroadcastChannel("EEP_LIVE");
const cmd = new BroadcastChannel("EEP");

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const p2 = n => String(n).padStart(2, "0");

let data = null, handle = null, timer = null, received = 0, trainKey = "";
let sigInfo = null, askedKey = "";
let cmdUrl = "", cmdOK = false, srcUrl = "", probeId = 0;   // Befehle an EEP: URL von /send-command, Server akzeptiert Befehle, aktuelle Daten-URL

// ---- Letzte Quelle merken -------------------------------------------
const LS = "eepBridge"; // Key in localStorage für letzte Quelle (src, url, file, iv, send)
const lsLoad = () => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; } };
const lsSave = o => { try { localStorage.setItem(LS, JSON.stringify(Object.assign(lsLoad(), o))); } catch (e) {} };

// IndexedDB für FileSystemFileHandle
const idb = () => new Promise((res, rej) => { 
  const r = indexedDB.open("eepBridge", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("h"); 
  r.onsuccess = () => res(r.result); 
  r.onerror = () => rej(r.error); 
});

// IndexedDB: FileSystemFileHandle speichern und laden
const idbSet = async (k, v) => { 
  const db = await idb(); 
  return new Promise((res, rej) => { 
    const t = db.transaction("h", "readwrite");
    t.objectStore("h").put(v, k); 
    t.oncomplete = res; 
    t.onerror = () => rej(t.error); }); 
};

// IndexedDB: FileSystemFileHandle laden
const idbGet = async k => { 
  const db = await idb(); 
  return new Promise((res, rej) => { 
    const r = db.transaction("h").objectStore("h").get(k);
    r.onsuccess = () => res(r.result); 
    r.onerror = () => rej(r.error); 
  }); 
};

// Button: letzte Datei anzeigen
function showLast() {
  const s = lsLoad();
  const b = $("bLast"); 
  b.hidden = !((s.src === "url" && s.url) || (s.src === "file" && s.file));
  b.textContent = s.src === "url" ? _("ZuletztURL", s.url) : _("ZuletztDatei", s.file);
}

// Seite geladen: letzte Quelle wiederherstellen
{ 
  const s = lsLoad();
  if (s.url) $("url").value = s.url;
  if (s.iv) $("iv").value = s.iv;
  if (s.send === false) $("send").checked = false;
  showLast(); 
}

// Eingaben: Intervall und Senden an Gleisplan merken
$("iv").onchange = () => { lsSave({iv: $("iv").value}); if (timer) schedulePoll(); };
$("send").onchange = () => { lsSave({send: $("send").checked}); if ($("send").checked) { push(); centerFollow(); } };

// ---- Befehle an EEP (POST /send-command am Webserver) ------------------------
let cstMsg = null, cstTimer = null;
function updateCst() {
  const s = $("cst");
  $("raw").hidden = !cmdOK;
  s.hidden = !cmdOK;
  if (!cmdOK) return;
  s.className = cstMsg && cstMsg.err ? "err" : "";
  s.textContent = cstMsg ? cstMsg.t : "⚡ " + _("CmdAktiv");
}
function cstShow(t, err) {
  cstMsg = {t: t, err: !!err}; updateCst();
  clearTimeout(cstTimer);
  cstTimer = setTimeout(() => { cstMsg = null; updateCst(); }, err ? 6000 : 3000);
}

function setCmd(ok, url) {
  const changed = ok !== cmdOK;
  cmdOK = ok; cmdUrl = ok ? url : "";
  updateCst();
  postCmdState();
  if (changed && data) render();
}
// Dem Gleisplan melden, ob Befehle an EEP möglich sind (Bedienelemente nur dann anzeigen)
function postCmdState() { live.postMessage({type: "cmdState", ok: cmdOK}); }

// Prueft, ob der Webserver zur Daten-URL Befehle annimmt. Dazu wird ein leerer POST an /send-command gesendet:
// 400 = Befehle aktiv (leerer Body wird abgelehnt, nichts wird geschrieben), 405 = nicht aktiviert,
// 403/Netzwerkfehler = Origin nicht erlaubt bzw. kein Server. Nur dann werden die Bedienelemente angezeigt.
async function probeCommands(dataUrl) {
  const id = ++probeId;
  let u;
  try { u = new URL("/send-command", new URL(dataUrl, window.location.href)); } catch (e) { return setCmd(false); }
  if (u.protocol !== "https:" && u.protocol !== "http:") return setCmd(false);
  let ok = false;
  try {
    const r = await fetch(u.href, {method: "POST", headers: {"Content-Type": "text/plain"}, body: "", cache: "no-store", redirect: "manual"});
    ok = r.status === 400;
  } catch (e) {}
  if (id === probeId) setCmd(ok, u.href);
}

// Ein Argument fuer die Pipe-Syntax. Trennzeichen ( ) , | und Anfuehrungszeichen werden in Anfuehrungszeichen gesetzt.
function cmdArg(v) {
  const s = String(v);
  if (/[\x00-\x1f\x7f]/.test(s)) return null;
  if (!/[()|,"']/.test(s)) return s;
  if (!s.includes('"')) return '"' + s + '"';
  if (!s.includes("'")) return "'" + s + "'";
  return null;
}
function buildCmd(fn, ...args) {
  const a = args.map(cmdArg);
  if (a.includes(null)) { cstShow(_("CmdZeichen"), true); return null; }
  return [fn, ...a].join("|");
}

async function sendCmd(line) {
  if (!cmdOK || !line) return false;
  try {
    const r = await fetch(cmdUrl, {method: "POST", headers: {"Content-Type": "text/plain; charset=utf-8"}, body: line, cache: "no-store", redirect: "manual"});
    if (!r.ok) {
      let m = ""; try { m = (await r.text()).slice(0, 80); } catch (e) {}
      throw new Error("HTTP " + r.status + (m ? " " + m : ""));
    }
    cstShow(_("CmdGesendet") + ": " + line);
    return true;
  } catch (e) {
    cstShow(_("CmdFehler") + ": " + e.message, true);
    if (e instanceof TypeError && srcUrl) probeCommands(srcUrl);   // Server nicht erreichbar: Verfuegbarkeit neu pruefen
    return false;
  }
}

// ---- Befehle vom Gleisplan (Kanal EEP_LIVE, type "command") ---------------------
// Der Gleisplan sendet nie selbst an EEP, sondern sendet sie über die Bridge. 
// Erlaubt sind nur diese Befehlemit genau diesen Argumenten; alles andere wird abgelehnt.
const CMD_RULES = {
  EEPSetSignal:            ["id", "state"],
  EEPSetSwitch:            ["id", "state"],
  EEPSetTrainSpeed:        ["name", "speed"],
  EEPSetTrainRoute:        ["name", "name"],
  EEPSetCamera:            ["camType", "name"],
  EEPSetPerspectiveCamera: ["camPos", "name"],
};
const CMD_CHECK = {
  id:      v => Number.isInteger(v) && v > 0 && v < 100000,
  state:   v => Number.isInteger(v) && v > 0 && v <= 99,
  speed:   v => typeof v === "number" && Number.isFinite(v) && Math.abs(v) <= 1000,
  name:    v => typeof v === "string" && v.length > 0 && v.length <= 100,
  camType: v => Number.isInteger(v) && v >= 0 && v <= 2,    // 0 statisch, 1 dynamisch, 2 mobil
  camPos:  v => Number.isInteger(v) && v >= 1 && v <= 9,    // Perspektive der Verfolgerkamera
};

function cmdReply(m, ok, text) { live.postMessage({type: "cmdResult", seq: m.seq, ok: ok, text: text}); }
async function runRemoteCmd(m) {
  if (!cmdOK) return cmdReply(m, false, _("CmdNichtVerfuegbar"));
  const rule = Object.hasOwn(CMD_RULES, m.fn) ? CMD_RULES[m.fn] : null;
  if (!rule || !Array.isArray(m.args) || m.args.length !== rule.length || !rule.every((k, i) => CMD_CHECK[k](m.args[i]))) {
    return cmdReply(m, false, _("CmdUngueltig"));
  }
  const line = buildCmd(m.fn, ...m.args);   // meldet ungültige Zeichen selbst in der Statuszeile
  if (!line) return cmdReply(m, false, _("CmdZeichen"));
  const ok = await sendCmd(line);
  cmdReply(m, ok, (ok ? _("CmdGesendet") : _("CmdFehler")) + ": " + line);
}

// ---- Textbefehl (nur hier, nicht im Gleisplan) ----------------------------------
// Die Zeile wird unverändert gesendet, ohne Whitelist der Bridge: Das Lua-Modul auf der EEP-Seite prüft selbst.
// Verboten sind nur Steuerzeichen (z. B. Zeilenumbrüche) und sehr lange Zeilen. Pfeil hoch/runter blättert durch die letzten Befehle.
let rawHist = (Array.isArray(lsLoad().raw) ? lsLoad().raw : []).slice(-20), rawPos = rawHist.length;
async function sendRaw() {
  const i = $("rawCmd"), line = i.value.trim();
  if (!line) return;
  if (/[\x00-\x1f\x7f]/.test(line) || line.length > 500) return cstShow(_("CmdZeichen"), true);
  if (await sendCmd(line)) {
    if (rawHist[rawHist.length - 1] !== line) { rawHist.push(line); rawHist = rawHist.slice(-20); lsSave({raw: rawHist}); }
    rawPos = rawHist.length;
    i.select();
  }
}
$("bRaw").onclick = sendRaw;
$("rawCmd").onkeydown = ev => {
  if (ev.key === "Enter") { ev.preventDefault(); sendRaw(); }
  else if (ev.key === "ArrowUp" && rawHist.length) { ev.preventDefault(); rawPos = Math.max(0, rawPos - 1); ev.target.value = rawHist[rawPos]; }
  else if (ev.key === "ArrowDown" && rawHist.length) { ev.preventDefault(); rawPos = Math.min(rawHist.length, rawPos + 1); ev.target.value = rawHist[rawPos] || ""; }
};

// Anzahl der Signal-Buttons: bekannt und klein -> genau so viele, sonst 3
const MAX_SIGBTN = 8;
function sigPositions(id) {
  const s = data.signals[id] || {};
  const pos = list(s.functions).map(f => f.position).filter(Number.isFinite);
  const n = Number(s.functionCount);
  if (pos.length && pos.length <= MAX_SIGBTN) return pos;
  if (Number.isInteger(n) && n > 0 && n <= MAX_SIGBTN) return Array.from({length: n}, (e, i) => i + 1);
  return [1, 2, 3];
}

// Pushbuttons fuer die Stellungen vals (aktuelle Stellung hervorgehoben); cls(v) liefert optionale CSS-Klassen
function cmdBtns(EEPFunction, id, currrentState, values, title, cls) {
  let h = "";
  for (const v of values) {
    const t = title ? title(v) : "";
    h += `<button class="cb${cls ? " " + cls(v) : ""}`
			+ `${Number(currrentState) === v ? " on" : ""}"`
			+ ` data-a="cmd"`
			+ ` data-f="${EEPFunction}"`
			+ ` data-i="${esc(id)}"`
			+ ` data-v="${v}"`
      + `${t ? ` title="${esc(t)}"` : ""}`
			+ `>`
			+ `${v}`
			+ `</button>`;
  }
  return h;
}

// ---- Darstellung -----------------------------------------------------------
const SWTXT = {1:["Durchfahrt","b"], 2:["Abzweig","o"], 3:["KoAbzweig","p"], 5:["Spezial","x"]};
const swChip = s => { const e = SWTXT[s], t = e ? _(e[0]) : _("Stellung") + " " + s; return `<span class="chip ${e ? e[1] : "x"}">${esc(t)}</span>`; };

// Mit Info aus dem Gleisplan: farbig. Sonst Text aus den Signalfunktionen des Exports (grau). Sonst neutral.
function sigChip(id, s) {
  const p = sigInfo && sigInfo[id] && sigInfo[id].pos[s];
  if (p) {
    const c = {halt:"r", fahrt:"g", warn:"o"}[p.cls] || "x";
    return `<span class="chip ${c}">${esc(s)}: ${esc(p.text || "?")}</span>`;
  }

  const fn = list(data.signals[id] && data.signals[id].functions).find(f => f.position === s);
  if (fn && fn.text) return `<span class="chip x">${esc(s)}: ${esc(fn.text)}</span>`;

  return `<span class="chip x">${esc(_("Stellung"))} ${esc(s)}</span>`;
}

// Hilfsfunktionen
const byNum = (a, b) => Number(a) - Number(b);
const list = x => x ? Object.values(x) : [];
const fmt = (n, d = 1) => (typeof n === "number" ? n.toFixed(d) : "–");
function status(msg, err) { const s = $("st"); s.removeAttribute("data-t"); s.textContent = msg; s.className = err ? "err" : ""; }

// Time to String
const timeStr = tm =>
  (tm && tm.hour != null) ? `${p2(tm.hour)}:${p2(tm.minute)}:${p2(tm.second)}` : "–:–:–";

// JSON-Daten verarbeiten, die von EEP exportiert wurden
// Nur bei geändertem Daten neu darstellen
let prevText = "";
function ingest(text) {
  if (text === prevText) return;
	
  let d;
  try { d = JSON.parse(text); } catch (e) { return status(_("UngueltigesJSON") + ": " + e.message, true); }
  if (!d.global || !d.trains) return status(_("KeinEEPExport"), true);

  prevText = text;
	data = d; 
	received = Date.now();
  render(); 
  askSignals(); 
  push(); 
  centerFollow();
}

// ---- Daten an Gleisplan senden ------------------------------------------
function push() { if (data && $("send").checked) live.postMessage({type: "data", data: data}); }
function centerFollow() {
  const t = data && data.trains[$("follow").value];
  if (t && t.position && $("send").checked) live.postMessage({type: "center", x: t.position.x, y: t.position.y});
}

// Signalstellungen vom Gleisplan erfragen. Gleisplan antwortet mit "signalInfo".
function askSignals(force) {
  if (!data) return;

  const ids = Object.keys(data.signals || {}).sort(byNum), key = ids.join(",");
  if (!force && sigInfo && key === askedKey) return;

  askedKey = key; 
  live.postMessage({type: "signalQuery", ids: ids});
}

// Nachrichten ready und signalInfo vom Gleisplan empfangen
live.onmessage = ev => {
  const m = ev.data;
  if (m.type === "ready") { 
    push(); 
    askSignals(true);
    postCmdState();
  } else if (m.type === "command") {
    runRemoteCmd(m);
  } else if (m.type === "signalInfo" && m.signals) { 
      sigInfo = m.signals;
      if (data) render(); 
  }
};

// ---- TableFilter (wie in EEP_Inventar.html) -------------------------------------
function tfConfig(caption) {
  return {
    base_path: "node_modules/tablefilter/dist/tablefilter/",
    auto_filter: { delay: 500 },
    state: { types: ["local_storage"], filters: true, filters_visibility: true },
    alternate_rows: true,
    mark_active_columns: { highlight_column: false },
    grid_layout: false,
    filters_row_index: 0,                 // Filterzeile über der Kopfzeile
    toolbar: true,
    rows_counter: { text: caption + ": " },
    status_bar: { msg_filter: _("Filter aktiv") + " ...", toolbar_position: "center" },
    btn_reset: { tooltip: _("Filter löschen"), toolbar_position: "right" },
    locale: "de",
    thousands_separator: ".",
    decimal_separator: ",",
    empty_operator: "[empty]",
    nonempty_operator: "[nonempty]",
    help_instructions: {
      text: _("Filter-Operatoren") + ":<br> "
        + `<b>&lt;</b>, <b>&lt;=</b>, <b>=</b>, <b>&gt;=</b>, <b>&gt;</b>, <br>`
        + `<b>*</b>, <b>!</b> (${_("nicht")}), <b>{</b> (${_("beginnt mit")}), <b>}</b> (${_("endet mit")}), <br>`
        + `<b>||</b> (${_("oder")}), <b>&amp;&amp;</b> (${_("und")}), <br>`
        + `<b>[empty]</b>, <b>[nonempty]</b>, <b>rgx:</b><br>`
        + `<a href="https://github.com/koalyptus/TableFilter/wiki/4.-Filter-operators" target="_blank">${_("Weitere Informationen")}</a><hr/>`,
      btn_text: "?",
    },
    no_results_message: { content: _("Keine zum Filter passende Einträge vorhanden") },
    loader: false,
    watermark: [_("Filter") + " ..."],
  };
}

const tfs = {}, lastHtml = {}, dirty = {};
const filterFocused = box => { const a = document.activeElement; return !!(a && box.contains(a) && a.closest(".fltrow, .inf")); };

// Tabelle in den Container boxId einsetzen und TableFilter anbinden.
// Ergebnis: true, wenn die Tabelle neu aufgebaut wurde.
function showTable(boxId, tableId, html, caption) {
  const box = $(boxId);
  if (lastHtml[boxId] === html) return false;                    // unverändert
  if (filterFocused(box)) { dirty[boxId] = true; return false; } // Eingabe im Filter nicht stören
  dirty[boxId] = false;
  lastHtml[boxId] = html;
  if (tfs[boxId]) { try { tfs[boxId].destroy(); } catch (e) {} tfs[boxId] = null; }
  box.innerHTML = html;
  if (window.TableFilter && box.querySelector("tbody tr")) {
    const tf = new TableFilter($(tableId), tfConfig(caption));
    tf.init();
    tfs[boxId] = tf;
  }
  return true;
}
// Nach Verlassen eines Filterfeldes das zurückgestellte Update nachholen
document.body.addEventListener("focusout", () => setTimeout(() => {
  if (data && Object.values(dirty).some(Boolean)) render();
}, 0));

// Darstellung der Daten
function render() {
  const g = data.global;
  const tm = g.time || {};
  const w = g.weather || {};

  // Globale Information
  $("gl").innerHTML = `<b>${timeStr(tm)}</b> ${_("EEPZeit")}`
      + ` · EEP ${esc(g.eepVersion)}<br>`
      + `${_("Wolken")} ${w.cloudsIntensity}%`
      + ` · ${_("Nebel")} ${w.fog}%`
      + ` · ${_("Regen")} ${w.rain}%`
      + ` · ${_("Schnee")} ${w.snow}%`
      + ` · ${_("Hagel")} ${w.hail}%`
      + ` · ${_("Wind")} ${w.wind}<br>`
      + `<small>${_("Aktiver Zug")}: ${esc(g.activeTrain || "–")}</small>`;

  // Züge
  const names = Object.keys(data.trains);
  let h = `<table id="tblTrains"><thead><tr>`
      + `<th>${_("Zug")}</th>`
      + `<th>km/h</th>`
      + `<th>${_("Soll")}</th>`
      + `<th>${_("Fahrzeuge")}</th>`
      + `<th>${_("Länge")}</th>`
      + `<th>${_("Route")}</th>`
      + `<th>${_("Gleis")}</th>`
      + `<th></th>`
      + `</tr></thead><tbody>`;
  for (const n of names) {
    const t = data.trains[n], k = t.track || {};
    h += `<tr class="${n === g.activeTrain ? "act" : ""}">`
      + `<td>${esc(n)}</td>`
      + `<td>${fmt(t.speed)}</td>`
      + `<td>${cmdOK
          ? `<input class="cin" type="number" step="any" data-cmd="speed" data-n="${esc(n)}" value="${typeof t.targetSpeed === "number" ? fmt(t.targetSpeed) : ""}">`
          : fmt(t.targetSpeed)}</td>`
      + `<td>${t.vehicleCount}</td>`
      + `<td>${fmt(t.length)} m</td>`
      + `<td>${cmdOK
          ? `<input class="cin rt" type="text" data-cmd="route" data-n="${esc(n)}" value="${esc(t.route || "")}">`
          : esc(t.route || "")}</td>`
      + `<td>${k.system}-${k.id} @ ${fmt(k.position, 0)} m</td>`
      + `<td><button data-a="center" data-n="${esc(n)}">${_("Zeige")}</button>`
      + `<button data-a="track" data-gs="${k.system}" data-gi="${k.id}">${_("GleisInfo")}</button></td>`
      + `</tr>`;
  }
  h += `</tbody></table>`;

  // Eingabefeld mit Fokus (und evtl. noch nicht übernommener Eingabe) beim Neuaufbau erhalten
  const ae = document.activeElement;
  const keep = (ae && ae.dataset && ae.dataset.cmd && $("trains").contains(ae))
    ? {c: ae.dataset.cmd, n: ae.dataset.n, v: ae.value, dirty: ae.value !== ae.defaultValue, s: ae.selectionStart, e: ae.selectionEnd} : null;
  if (showTable("trains", "tblTrains", h, _("Züge")) && keep) {
    const ni = Array.from($("trains").querySelectorAll("input[data-cmd]")).find(x => x.dataset.cmd === keep.c && x.dataset.n === keep.n);
    if (ni) {
      if (keep.dirty) ni.value = keep.v;
      ni.focus();
      try { ni.setSelectionRange(keep.s, keep.e); } catch (e) {}   // bei type=number nicht möglich
    }
  }
  const key = names.join("|");
  if (key !== trainKey) {
    trainKey = key; const cur = $("follow").value;
    $("follow").innerHTML = `<option value="">${esc(_("kein Zug"))}</option>` + names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
    $("follow").value = names.includes(cur) ? cur : "";
  }

  // Signale
  $("sigNote").textContent = sigInfo ? _("sigNoteGleisplan") : _("sigNoteNeutral");
  h = `<table id="tblSignals"><thead><tr>`
      + `<th>ID</th>`
      + `<th>${_("Stellung")}</th>`
      + (cmdOK ? `<th>${esc(_("CmdStellungSetzen"))}</th>` : "")
      + `<th>${_("TipTxt")}</th>`
      + `<th>${_("Züge")}</th>`
      + `<th></th>`
      + `</tr></thead><tbody>`;
  for (const id of Object.keys(data.signals || {}).sort(byNum)) {
    const s = data.signals[id], tr = list(s.trains);
    const tip = sigInfo && sigInfo[id] && sigInfo[id].tip;      // Tipp-Text aus dem Gleisplan
    h += `<tr>`
      + `<td>${id}</td>`
      + `<td>${sigChip(id, s.state)}</td>`
      + (cmdOK
          ? `<td>${cmdBtns(
              "EEPSetSignal", id, s.state, sigPositions(id),
              v => {
                const p = sigInfo && sigInfo[id] && sigInfo[id].pos[v];
                if (p && p.text) return p.text;
                const f = list(s.functions).find(f => f.position === v);
                return f && f.text || "";
              }
            )}</td>`
          : "")
      + `<td class="wrap">${tip ? esc(tip) : ""}</td>`
      + `<td>${tr.length ? esc(tr.join(", ")) : ""}</td>`
      + `<td><button data-a="id" data-i="${id}">${_("Zeige")}</button></td>`
      + `</tr>`;
  }
  showTable("sigs", "tblSignals", h + `</tbody></table>`, _("Signale"));

  // Weichen
  h = `<table id="tblSwitches"><thead><tr>`
      + `<th>ID</th>`
      + `<th>${_("Stellung")}</th>`
      + (cmdOK ? `<th>${esc(_("CmdStellungSetzen"))}</th>` : "")
      + `<th></th>`
      + `</tr></thead><tbody>`;
  for (const id of Object.keys(data.switches || {}).sort(byNum)) {
    h += `<tr>`
      + `<td>${id}</td>`
      + `<td>${swChip(data.switches[id].state)}</td>`
      + (cmdOK ? `<td>${cmdBtns(
            "EEPSetSwitch", id, data.switches[id].state, [1, 2, 3],
            v => SWTXT[v] ? _(SWTXT[v][0]) : "",
            v => "sw sw" + v
          )}</td>`
        : "")
      + `<td><button data-a="id" data-i="${id}">${_("Zeige")}</button></td>`
      + `</tr>`;
  }
  showTable("sws", "tblSwitches", h + `</tbody></table>`, _("Weichen"));

  // Rollmaterialien
  h = `<table id="tblRolling"><thead><tr>`
      + `<th>${_("Name")}</th>`
      + `<th>${_("Zug")}</th>`
      + `<th>${_("Länge")}</th>`
      + `<th>${_("Gleis")}</th>`
      + `<th>${_("Position")} (x, y, z)</th>`
      + `<th>${_("KupplungVH")}</th>`
      + `</tr></thead><tbody>`;
  for (const n of Object.keys(data.rollingstock || {})) {
    const r = data.rollingstock[n], k = r.track || {}, p = r.position || {};
    h += `<tr>`
      + `<td>${esc(n)}${r.gears > 0 ? " (" + _("Lok") + ")" : ""}</td>`
      + `<td>${esc(r.train || "")}</td>`
      + `<td>${fmt(r.length, 2)} m</td>`
      + `<td>${k.system}-${k.id} @ ${fmt(k.position, 1)}${k.direction === 1 ? " →" : " ←"}</td>`
      + `<td>${fmt(p.x)}, ${fmt(p.y)}, ${fmt(p.z, 2)}</td>`
      + `<td>${r.couplingFront}/${r.couplingRear}</td>`
      + `</tr>`;
  }
  showTable("rs", "tblRolling", h + `</tbody></table>`, _("Rollmaterialien"));
}

  if (!data) return;

document.body.addEventListener("click", ev => {
  const b = ev.target.closest("button[data-a]"); 
  if (!b) return;

  const a = b.dataset.a;
  if (a === "center") {
    const t = data.trains[b.dataset.n];
    if (t && t.position) live.postMessage({type: "center", x: t.position.x, y: t.position.y});

  } else if (a === "track") {
    live.postMessage({type: "showTrack", GleissystemID: Number(b.dataset.gs), GleisID: Number(b.dataset.gi)});

  } else if (a === "id") {

  } else if (a === "cmd") {
    sendCmd(buildCmd(b.dataset.f, Number(b.dataset.i), Number(b.dataset.v)));   // EEPSetSignal|ID|Stellung bzw. EEPSetSwitch|ID|Stellung
  }

// Eingabefelder der Zugtabelle: Befehl bei Eingabe (Enter oder Feld verlassen)
document.body.addEventListener("change", ev => {
  const i = ev.target.closest && ev.target.closest("input[data-cmd]");
  if (!i || !cmdOK) return;
  if (i.dataset.cmd === "speed") {
    const v = parseFloat(i.value.replace(",", "."));
    if (Number.isFinite(v)) sendCmd(buildCmd("EEPSetTrainSpeed", i.dataset.n, v));
  } else if (i.dataset.cmd === "route") {
    const r = i.value.trim();
    if (r) sendCmd(buildCmd("EEPSetTrainRoute", i.dataset.n, r));
  }
});

// ---- Datenquellen ------------------------------------------------------------
let pollFn = null, liveUrl = "", ws = null, wsTimer = null, transport = "HTTP";

// WebSocket-Adresse aus der URL der Exportdatei: https -> wss, http -> ws.
// Bei anderen Quellen (z. B. file://) bleibt sie leer, dann wird nur per HTTP abgefragt.
function wsAddress(u) {
  try {
    const a = new URL(u, window.location.href);
    if (a.protocol === "https:") a.protocol = "wss:";
    else if (a.protocol === "http:") a.protocol = "ws:";
    else return "";
    a.hash = "";
    return a.href;
  } catch (e) { return ""; }
}

// WebSocket beenden (z. B. beim Wechsel der Quelle)
function stopLive() {
  clearTimeout(wsTimer); wsTimer = null; liveUrl = "";
  if (ws) {
    ws.onopen = ws.onmessage = ws.onclose = ws.onerror = null;
    try { ws.close(); } catch (e) {}
    ws = null;
  }
  transport = "HTTP";
}

// WebSocket zum Server aufbauen: der Server sendet die Exportdatei sofort und danach bei jeder Aenderung.
// Solange der Socket offen ist, wird nicht mehr gepollt. Bei Verbindungsverlust wird wieder gepollt
// und nach 5 Sekunden ein neuer Verbindungsversuch gemacht.
function connectLive() {
  if (!liveUrl || ws || !window.WebSocket) return;
  let s;
  try { s = new WebSocket(liveUrl); } catch (e) {  
    // Greift nur bei synchronen Fehlern (z.B. ungültiges URL-Schema)
    console.error("Synchroner Fehler:", e);
		return; 
	}	
  ws = s;
  s.onopen = () => { 
		transport = "WebSocket"; 
		clearInterval(timer); 
		timer = null; 
		if (!cmdOK && srcUrl) probeCommands(srcUrl); 
	};
  s.onmessage = ev => { if (typeof ev.data === "string") ingest(ev.data); };
	s.onerror = function(error) {
		console.log("WebSocket-Verbindungsfehler abgefangen!");
		return;
	};	
	s.onclose = () => {
    if (ws !== s) return;
    ws = null; transport = "HTTP";
    if (!liveUrl) return;
    if (!timer && pollFn) schedulePoll();
    wsTimer = setTimeout(connectLive, 5000);
  };
}

// Liest Bytes als UTF-8; ist der Inhalt kein gültiges UTF-8, wird Windows-1252 (ANSI) verwendet.
function EEP_decode(buf) {
	try { return new TextDecoder("utf-8", {fatal: true}).decode(buf); }
	catch (e) { return new TextDecoder("windows-1252").decode(buf); }
}

// Datenquelle in Intervallen abfragen (Datei oder URL); gibt den Promise des ersten Abrufs zurueck
function schedulePoll() {
  clearInterval(timer);
  const run = () => pollFn().catch(e => status(_("Fehler") + ": " + e.message, true));
  const first = run();
  timer = setInterval(run, Math.max(200, $("iv").value * 1000)); // Mindestens 1/5 Sekunde, wie in EEP
  return first;
}

// Datenquelle starten. Erster Abruf per HTTP(S); bei URL-Quellen danach Umschalten auf WebSocket (liveUrl).
function startPoll(fn, lu) {
  stopLive();
  pollFn = fn;
  liveUrl = lu || "";
  const first = schedulePoll();
  if (liveUrl) first.then(connectLive);
}

// Aktion verarbeiten: Datei live verfolgen
function useHandle(h) {
  handle = h; 
  srcUrl = ""; probeId++; setCmd(false);   // Datei: kein Webserver, keine Befehle
  lsSave({src: "file", file: h.name}); 
  showLast();
  idbSet("file", h).catch(() => {});
	startPoll(async () => ingest(EEP_decode(await (await handle.getFile()).arrayBuffer()))); // incl. Konvertierung von ANSI wenn nötig

}

// Aktion verarbeiten: Datei live verfolgen
// Zeigt eine Datei-Auswahl an, die nur JSON-Dateien erlaubt. Wenn der Benutzer eine Datei auswählt, wird ein FileSystemFileHandle zurückgegeben.
$("bFile").onclick = async () => {
  if (!window.showOpenFilePicker)  { return $("fOnce").click(); }  // Fallback: Datei einmal laden

   try { useHandle((await showOpenFilePicker({id: "eep-export", types: [{accept: {"application/json": [".json"]}}]}))[0]); } catch (e) {}
};

// Aktion verarbeiten: URL abfragen
// Zeigt eine Eingabeaufforderung an, in der der Benutzer eine URL eingeben kann. Wenn der Benutzer eine URL eingibt, wird die URL abgerufen und die Daten werden verarbeitet.
$("bUrl").onclick = () => {
  lsSave({src: "url", url: $("url").value}); 
  showLast();
  srcUrl = $("url").value;
  setCmd(false);
  probeCommands(srcUrl);   // Befehle nur anbieten, wenn der Webserver sie annimmt
  startPoll(async () => {
    const u = $("url").value, r = await fetch(u + (/\?/.test(u) ? "&" : "?") + "t=" + Date.now(), {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
		ingest(EEP_decode(await r.arrayBuffer())); // incl. Konvertierung von ANSI wenn nötig
  }, wsAddress($("url").value));
};

// Aktion verarbeiten: letzte Datei laden
// Wenn die letzte Quelle eine URL war, wird die URL abgerufen und die Daten werden verarbeitet. Wenn die letzte Quelle eine Datei war, wird die Datei live verfolgt.
$("bLast").onclick = async () => {
  const s = lsLoad();
  if (s.src === "url") { 
      $("url").value = s.url; 
      return $("bUrl").click();  // Aktion auslösen: URL abfragen
  }
  try { const h = await idbGet("file");
    if (h && h.name === s.file && (await h.requestPermission({mode: "read"})) === "granted") return useHandle(h);
  } catch (e) {}
  $("bFile").click(); // Aktion auslösen: Datei live verfolgen
};

// Aktion verarbeiten: Datei einmalig laden
// Wenn der Benutzer eine Datei auswählt, wird die Datei gelesen und die Daten werden verarbeitet.
async function once(f) {
  stopLive();
  clearInterval(timer); 
  timer = null; 
  srcUrl = ""; probeId++; setCmd(false);
  lsSave({src: "file", file: f.name}); 
  showLast();
	ingest(EEP_decode(await f.arrayBuffer())); // incl. Konvertierung von ANSI wenn nötig
}

// Datei einmalig laden: Datei-Auswahl oder Drag&Drop
$("fOnce").onchange = async e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (f) once(f);
};
// Drag&Drop: Mit Handle live, sonst Datei einmalig laden
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", async e => {
  e.preventDefault();
  const item = e.dataTransfer.items && e.dataTransfer.items[0];
  try {
    const h = item && item.getAsFileSystemHandle ? await item.getAsFileSystemHandle() : null;
    if (h && h.kind === "file") return useHandle(h);
  } catch (err) {}
  if (e.dataTransfer.files[0]) once(e.dataTransfer.files[0]);
});
