<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Segoe UI, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Szenario C: Live-Daten und EEP-Befehle von einem anderen Rechner im Heimnetzwerk</title>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#455a64"/></marker>
    <marker id="al" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 Z" fill="#455a64"/></marker>
  </defs>
  <rect width="900" height="610" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a237e">Szenario C: Live-Daten und EEP-Befehle auf einem anderen Rechner im Heimnetz</text>

  <!-- GitHub optional -->
  <rect x="140" y="52" width="260" height="56" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="270" y="76" text-anchor="middle" font-weight="bold" fill="#e65100">GitHub Pages</text>
  <text x="270" y="95" text-anchor="middle" font-size="12">Quelle der Seiten (Internet am EEP-Rechner)</text>
  <line x1="300" y1="110" x2="340" y2="262" stroke="#455a64" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="332" y="170" font-size="11" fill="#37474f">holt Seiten bei Bedarf</text>
  <text x="332" y="185" font-size="11" fill="#37474f">(-ProxyGitHub)</text>

  <!-- EEP-Rechner -->
  <rect x="20" y="125" width="470" height="450" rx="14" fill="none" stroke="#546e7a" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="35" y="147" font-weight="bold" fill="#37474f">EEP-Rechner (feste IP, z. B. 192.168.0.115)</text>

  <rect x="40" y="215" width="190" height="105" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="135" y="239" text-anchor="middle" font-weight="bold" fill="#311b92">EEP mit Anlage</text>
  <text x="135" y="263" text-anchor="middle" font-size="13">Lua-Module:</text>
  <text x="135" y="283" text-anchor="middle" font-size="13">EepExport.lua</text>
  <text x="135" y="302" text-anchor="middle" font-size="13">CommandExecution.lua</text>

  <rect x="40" y="385" width="190" height="165" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="135" y="409" text-anchor="middle" font-weight="bold" fill="#1b5e20">Anlagenordner</text>
  <text x="135" y="434" text-anchor="middle" font-size="12">exchange\eep_export.json</text>
  <text x="135" y="456" text-anchor="middle" font-size="12">exchange\commands-to-eep.txt</text>
  <text x="135" y="478" text-anchor="middle" font-size="12">MeineAnlage.anl3</text>
  <text x="135" y="504" text-anchor="middle" font-size="12">EEP Export … (PC-Name).cer</text>
  <text x="135" y="524" text-anchor="middle" font-size="11" fill="#546e7a">(neben dem Installationsskript)</text>

  <line x1="85" y1="320" x2="85" y2="383" stroke="#455a64" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="93" y="355" font-size="11" fill="#37474f">schreibt</text>
  <line x1="190" y1="383" x2="190" y2="322" stroke="#455a64" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="198" y="355" font-size="11" fill="#37474f">liest Befehle</text>

  <rect x="290" y="265" width="180" height="230" rx="10" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
  <text x="380" y="291" text-anchor="middle" font-weight="bold" fill="#880e4f">Webserver</text>
  <text x="380" y="311" text-anchor="middle" font-size="13">Python oder Node.js</text>
  <text x="380" y="339" text-anchor="middle" font-size="12">https://192.168.0.115[:Port]</text>
  <text x="380" y="361" text-anchor="middle" font-size="12">liefert .json und .anl3</text>
  <text x="380" y="383" text-anchor="middle" font-size="12">WebSocket (Live-Daten)</text>
  <text x="380" y="405" text-anchor="middle" font-size="12">nimmt Befehle an</text>
  <text x="380" y="427" text-anchor="middle" font-size="12">liefert Bridge + Gleisplan</text>
  <text x="380" y="447" text-anchor="middle" font-size="11" fill="#546e7a">-ActivateCommands</text>
  <text x="380" y="464" text-anchor="middle" font-size="11" fill="#546e7a">-ProxyGitHub -OpenFirewall</text>

  <line x1="232" y1="410" x2="288" y2="410" stroke="#455a64" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="288" y1="440" x2="232" y2="440" stroke="#455a64" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- Gerät im Heimnetz -->
  <rect x="650" y="125" width="235" height="450" rx="14" fill="none" stroke="#546e7a" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="667" y="147" font-weight="bold" fill="#37474f">Laptop / Tablet / Smartphone</text>

  <rect x="665" y="195" width="205" height="215" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="767" y="219" text-anchor="middle" font-weight="bold" fill="#0d47a1">Browser</text>
  <rect x="680" y="235" width="175" height="60" rx="8" fill="#ffffff" stroke="#1565c0"/>
  <text x="767" y="260" text-anchor="middle" font-weight="bold">Export Bridge</text>
  <text x="767" y="280" text-anchor="middle" font-size="12">Tabellen, Befehle</text>
  <rect x="680" y="320" width="175" height="60" rx="8" fill="#ffffff" stroke="#1565c0"/>
  <text x="767" y="345" text-anchor="middle" font-weight="bold">Gleisplan</text>
  <text x="767" y="365" text-anchor="middle" font-size="12">Live-Zustand, Bedienung</text>
  <line x1="767" y1="297" x2="767" y2="318" stroke="#455a64" stroke-width="2" marker-start="url(#al)" marker-end="url(#ar)"/>

  <rect x="665" y="450" width="205" height="85" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="767" y="476" text-anchor="middle" font-weight="bold" fill="#1b5e20">Zertifikat (.cer)</text>
  <text x="767" y="498" text-anchor="middle" font-size="12">einmalig importiert als</text>
  <text x="767" y="516" text-anchor="middle" font-size="12">vertrauenswürdige Stammzert.</text>

  <!-- Heimnetz-Verbindung -->
  <line x1="472" y1="330" x2="663" y2="330" stroke="#455a64" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="567" y="318" text-anchor="middle" font-size="11" fill="#37474f">Seiten, JSON, anl3</text>
  <text x="567" y="348" text-anchor="middle" font-size="11" fill="#37474f">(HTTPS / WSS)</text>
  <line x1="663" y1="385" x2="472" y2="385" stroke="#455a64" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="567" y="403" text-anchor="middle" font-size="11" fill="#37474f">Befehle (POST)</text>
  <text x="567" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#546e7a">Heimnetz (LAN / WLAN)</text>

  <path d="M 232 530 C 400 590 560 590 665 505" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="450" y="598" text-anchor="middle" font-size="11" fill="#2e7d32">einmalig: .cer-Datei kopieren (E-Mail, Cloud, AirDrop, USB)</text>
</svg>
