<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" font-family="Segoe UI, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Szenario B: Live-Daten und EEP-Befehle auf dem Rechner mit EEP</title>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#455a64"/></marker>
    <marker id="al" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 Z" fill="#455a64"/></marker>
  </defs>
  <rect width="900" height="590" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a237e">Szenario B: Live-Daten und EEP-Befehle auf demselben Rechner wie EEP</text>

  <!-- GitHub -->
  <rect x="320" y="52" width="260" height="62" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="450" y="78" text-anchor="middle" font-weight="bold" fill="#e65100">GitHub Pages</text>
  <text x="450" y="99" text-anchor="middle" font-size="12">Bridge, Gleisplan, Inventar</text>

  <!-- EEP-Rechner -->
  <rect x="25" y="150" width="850" height="385" rx="14" fill="none" stroke="#546e7a" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="40" y="172" font-weight="bold" fill="#37474f">EEP-Rechner (Windows 11)</text>

  <!-- EEP -->
  <rect x="50" y="190" width="220" height="110" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="160" y="214" text-anchor="middle" font-weight="bold" fill="#311b92">EEP mit Anlage</text>
  <text x="160" y="240" text-anchor="middle" font-size="13">Lua-Module:</text>
  <text x="160" y="262" text-anchor="middle" font-size="13">EepExport.lua</text>
  <text x="160" y="282" text-anchor="middle" font-size="13">CommandExecution.lua</text>

  <!-- Ordner -->
  <rect x="50" y="360" width="220" height="150" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="160" y="383" text-anchor="middle" font-weight="bold" fill="#1b5e20">Anlagenordner</text>
  <text x="160" y="410" text-anchor="middle" font-size="13">exchange\eep_export.json</text>
  <text x="160" y="436" text-anchor="middle" font-size="13">exchange\commands-to-eep.txt</text>
  <text x="160" y="462" text-anchor="middle" font-size="13">MeineAnlage.anl3</text>
  <text x="160" y="490" text-anchor="middle" font-size="11" fill="#546e7a">(= -SitePath des Webservers)</text>

  <!-- EEP <-> Ordner -->
  <line x1="100" y1="300" x2="100" y2="358" stroke="#455a64" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="108" y="334" font-size="11" fill="#37474f">schreibt JSON</text>
  <line x1="225" y1="358" x2="225" y2="302" stroke="#455a64" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="233" y="334" font-size="11" fill="#37474f">liest Befehle</text>

  <!-- Webserver -->
  <rect x="320" y="270" width="190" height="180" rx="10" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
  <text x="415" y="296" text-anchor="middle" font-weight="bold" fill="#880e4f">Webserver</text>
  <text x="415" y="316" text-anchor="middle" font-size="13">Python oder Node.js</text>
  <text x="415" y="344" text-anchor="middle" font-size="12">https://localhost[:Port]</text>
  <text x="415" y="366" text-anchor="middle" font-size="12">liefert .json und .anl3</text>
  <text x="415" y="388" text-anchor="middle" font-size="12">WebSocket für Live-Daten</text>
  <text x="415" y="410" text-anchor="middle" font-size="12">nimmt Befehle an</text>
  <text x="415" y="430" text-anchor="middle" font-size="11" fill="#546e7a">(-ActivateCommands)</text>

  <!-- Ordner <-> Webserver -->
  <line x1="270" y1="390" x2="318" y2="390" stroke="#455a64" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="294" y="383" text-anchor="middle" font-size="10" fill="#37474f">liest</text>
  <line x1="318" y1="425" x2="272" y2="425" stroke="#455a64" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="294" y="441" text-anchor="middle" font-size="10" fill="#37474f">schreibt</text>

  <!-- Browser -->
  <rect x="610" y="190" width="240" height="320" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="730" y="214" text-anchor="middle" font-weight="bold" fill="#0d47a1">Browser</text>
  <rect x="630" y="230" width="200" height="90" rx="8" fill="#ffffff" stroke="#1565c0"/>
  <text x="730" y="256" text-anchor="middle" font-weight="bold">Export Bridge</text>
  <text x="730" y="278" text-anchor="middle" font-size="12">Tabellen, Befehle,</text>
  <text x="730" y="298" text-anchor="middle" font-size="12">URL abfragen</text>
  <rect x="630" y="400" width="200" height="90" rx="8" fill="#ffffff" stroke="#1565c0"/>
  <text x="730" y="426" text-anchor="middle" font-weight="bold">Gleisplan</text>
  <text x="730" y="448" text-anchor="middle" font-size="12">Züge, Signale, Weichen live,</text>
  <text x="730" y="468" text-anchor="middle" font-size="12">Bedienung per Klick</text>
  <line x1="730" y1="322" x2="730" y2="398" stroke="#455a64" stroke-width="2.5" marker-start="url(#al)" marker-end="url(#ar)"/>
  <text x="738" y="366" font-size="11" fill="#37474f">BroadcastChannel</text>

  <!-- Webserver <-> Browser -->
  <line x1="512" y1="320" x2="608" y2="320" stroke="#455a64" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="560" y="310" text-anchor="middle" font-size="11" fill="#37474f">JSON, anl3</text>
  <line x1="608" y1="395" x2="512" y2="395" stroke="#455a64" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="560" y="414" text-anchor="middle" font-size="11" fill="#37474f">Befehle (POST)</text>

  <!-- GitHub -> Browser -->
  <line x1="580" y1="95" x2="730" y2="188" stroke="#455a64" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="690" y="120" font-size="11" fill="#37474f">Seiten laden</text>
  <!-- GitHub -> Webserver (optional) -->
  <line x1="450" y1="116" x2="415" y2="268" stroke="#455a64" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="395" y="205" text-anchor="end" font-size="11" fill="#37474f">oder: Seiten über den Webserver</text>
  <text x="395" y="220" text-anchor="end" font-size="11" fill="#37474f">(-ProxyGitHub)</text>

  <text x="450" y="565" text-anchor="middle" font-size="12" fill="#455a64">Ohne Befehle genügt auch: Bridge liest die JSON-Datei direkt (Datei live verfolgen, Chrome/Edge), dann ohne Webserver.</text>
</svg>
