<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="Segoe UI, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Szenario A: Nur statischer Gleisplan</title>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#455a64"/></marker>
  </defs>
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a237e">Szenario A: Nur statischer Gleisplan</text>

  <!-- GitHub Pages -->
  <rect x="40" y="80" width="300" height="150" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="190" y="108" text-anchor="middle" font-weight="bold" fill="#e65100">GitHub Pages (Internet)</text>
  <text x="190" y="140" text-anchor="middle">EEP_Gleisplan.html</text>
  <text x="190" y="165" text-anchor="middle">EEP_Inventar.html</text>
  <text x="190" y="190" text-anchor="middle">EEP_Signale.html</text>
  <text x="190" y="214" text-anchor="middle" font-size="12" fill="#6d4c41">frankbuchholz.github.io/EEP_convert_anl3_file</text>

  <!-- Browser -->
  <rect x="520" y="80" width="340" height="200" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="690" y="108" text-anchor="middle" font-weight="bold" fill="#0d47a1">Browser (Chrome, Edge, Firefox)</text>
  <rect x="545" y="125" width="130" height="34" rx="6" fill="#ffffff" stroke="#1565c0"/>
  <text x="610" y="147" text-anchor="middle">Gleisplan</text>
  <rect x="690" y="125" width="145" height="34" rx="6" fill="#ffffff" stroke="#1565c0"/>
  <text x="762" y="147" text-anchor="middle">Inventar / Signale</text>
  <text x="690" y="195" text-anchor="middle">zeigt Gleisplan, Inventarlisten,</text>
  <text x="690" y="215" text-anchor="middle">Signalstellungen der Anlage</text>
  <text x="690" y="250" text-anchor="middle" font-size="12" fill="#37474f">Programme laufen im Browser, nichts wird installiert</text>

  <line x1="340" y1="155" x2="518" y2="155" stroke="#455a64" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="429" y="143" text-anchor="middle" font-size="12" fill="#37474f">Programme laden</text>
  <text x="429" y="177" text-anchor="middle" font-size="12" fill="#37474f">(HTTPS)</text>

  <!-- Anlagendatei -->
  <rect x="520" y="340" width="340" height="70" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="690" y="368" text-anchor="middle" font-weight="bold" fill="#1b5e20">Anlage-Datei (.anl3 oder .zip)</text>
  <text x="690" y="392" text-anchor="middle" font-size="12" fill="#37474f">z. B. vom eigenen Rechner oder aus dem EEP-Forum</text>
  <line x1="690" y1="340" x2="690" y2="282" stroke="#455a64" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="702" y="316" font-size="12" fill="#37474f">Datei-Auswahl, Drag&amp;Drop oder URL</text>

  <!-- nicht noetig -->
  <rect x="40" y="290" width="340" height="120" rx="12" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="210" y="318" text-anchor="middle" font-weight="bold" fill="#616161">Nicht nötig</text>
  <text x="210" y="345" text-anchor="middle" fill="#757575">✗ Webserver   ✗ Export Bridge</text>
  <text x="210" y="368" text-anchor="middle" fill="#757575">✗ Lua-Module in EEP</text>
  <text x="210" y="391" text-anchor="middle" fill="#757575">✗ Live-Daten   ✗ EEP-Befehle</text>
</svg>
