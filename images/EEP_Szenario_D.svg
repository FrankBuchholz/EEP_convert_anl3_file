<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Segoe UI, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Szenario D: Lokale Installation der Programme</title>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#455a64"/></marker>
  </defs>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a237e">Szenario D: Lokale Installation der Programme</text>

  <!-- Archiv -->
  <rect x="30" y="80" width="190" height="90" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="125" y="110" text-anchor="middle" font-weight="bold" fill="#e65100">Archiv</text>
  <text x="125" y="134" text-anchor="middle" font-size="12">EEP_convert_anl3_file.zip</text>
  <text x="125" y="152" text-anchor="middle" font-size="11" fill="#6d4c41">(Download von GitHub Pages)</text>

  <line x1="125" y1="172" x2="125" y2="228" stroke="#455a64" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="135" y="205" font-size="12" fill="#37474f">entpacken</text>

  <!-- Programmordner -->
  <rect x="30" y="230" width="190" height="200" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="125" y="256" text-anchor="middle" font-weight="bold" fill="#1b5e20">Programmordner</text>
  <text x="125" y="284" text-anchor="middle" font-size="12">EEP_Gleisplan.html</text>
  <text x="125" y="304" text-anchor="middle" font-size="12">EEP_Inventar.html</text>
  <text x="125" y="324" text-anchor="middle" font-size="12">EEP_Signale.html</text>
  <text x="125" y="344" text-anchor="middle" font-size="12">EEP_Export_Bridge.html</text>
  <text x="125" y="368" text-anchor="middle" font-size="12">js, css, node_modules, Lua</text>
  <text x="125" y="392" text-anchor="middle" font-size="12">WebServer (Skripte)</text>
  <text x="125" y="414" text-anchor="middle" font-size="11" fill="#546e7a">keine Internetverbindung nötig</text>

  <!-- Browser -->
  <rect x="320" y="150" width="300" height="290" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="470" y="178" text-anchor="middle" font-weight="bold" fill="#0d47a1">Browser</text>
  <text x="470" y="200" text-anchor="middle" font-size="12" fill="#37474f">Programme von der lokalen Kopie öffnen</text>
  <rect x="340" y="215" width="260" height="62" rx="8" fill="#ffffff" stroke="#1565c0"/>
  <text x="470" y="240" text-anchor="middle" font-weight="bold">Szenario A</text>
  <text x="470" y="261" text-anchor="middle" font-size="12">statischer Gleisplan, Inventar</text>
  <rect x="340" y="287" width="260" height="62" rx="8" fill="#ffffff" stroke="#1565c0"/>
  <text x="470" y="312" text-anchor="middle" font-weight="bold">Szenario B</text>
  <text x="470" y="333" text-anchor="middle" font-size="12">Live-Daten und Befehle am EEP-Rechner</text>
  <rect x="340" y="359" width="260" height="62" rx="8" fill="#ffffff" stroke="#1565c0"/>
  <text x="470" y="384" text-anchor="middle" font-weight="bold">Szenario C</text>
  <text x="470" y="405" text-anchor="middle" font-size="12">Zugriff von anderen Geräten im Heimnetz</text>

  <line x1="222" y1="330" x2="318" y2="330" stroke="#455a64" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="270" y="320" text-anchor="middle" font-size="11" fill="#37474f">öffnen</text>

  <!-- Webserver / EEP -->
  <rect x="690" y="215" width="190" height="205" rx="12" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="785" y="241" text-anchor="middle" font-weight="bold" fill="#616161">Optional</text>
  <text x="785" y="270" text-anchor="middle" font-size="12">EEP mit EepExport und</text>
  <text x="785" y="288" text-anchor="middle" font-size="12">CommandExecution</text>
  <text x="785" y="318" text-anchor="middle" font-size="12">Webserver (Python oder</text>
  <text x="785" y="336" text-anchor="middle" font-size="12">Node.js) für .json, .anl3</text>
  <text x="785" y="354" text-anchor="middle" font-size="12">und Befehle</text>
  <text x="785" y="388" text-anchor="middle" font-size="11" fill="#757575">Zugriff über URLs</text>
  <line x1="622" y1="330" x2="688" y2="330" stroke="#455a64" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ar)"/>

  <rect x="150" y="458" width="600" height="30" rx="15" fill="#e8eaf6" stroke="#3949ab"/>
  <text x="450" y="478" text-anchor="middle" font-size="13" fill="#1a237e">Alle Möglichkeiten stehen zur Verfügung, auch ohne Internet (außer -ProxyGitHub)</text>
</svg>
