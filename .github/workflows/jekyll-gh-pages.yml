# Combined workflow: Build site, create ZIP, inject node_modules and deploy to Pages
# see corresponding file _config.yml in root the directory
name: Deploy Jekyll with Node dependencies and ZIP download

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 1. Abhängigkeiten der node-Pakete installieren und ggf. App bauen
      - name: Install dependencies and build assets
        run: |
          npm ci
          #npm run build # (bei diesem Projekt nicht nötig)

      # 2. Präzises ZIP-Archiv im dist-Ordner erstellen (VOR dem Jekyll-Build)
      # Dadurch gibt es keine Permission-Probleme.
      # Wichtig: Wir nutzen temporär die echten node_modules für das ZIP.
      - name: Create project ZIP archive
        run: |
          mkdir -p dist
          zip -r ./dist/EEP_convert_anl3_file.zip \
            EEP_Gleisplan.html \
            EEP_Inventar.html \
            EEP_Export_Bridge.html \
            EEP_Signale.html \
            EEP_blockControl.html \
            js/ \
            css/ \
            Lua/ \
            images/ \
            WebServer/ \
            README.md \
            EEP_Export_Bridge.md \
            node_modules/toolwindow/dist/ \
            node_modules/tablefilter/dist/tablefilter/ \
            node_modules/svg-pan-zoom/dist/

      # 3. Struktur für die Live-Webseite in einem temporären Ordner vorbereiten
      - name: Prepare node_modules files for web view
        run: |
          mkdir -p vendor_node_modules/toolwindow/dist
          mkdir -p vendor_node_modules/tablefilter/dist/tablefilter
          mkdir -p vendor_node_modules/svg-pan-zoom/dist
          
          cp -r node_modules/toolwindow/dist/* vendor_node_modules/toolwindow/dist/
          cp -r node_modules/tablefilter/dist/tablefilter/* vendor_node_modules/tablefilter/dist/tablefilter/
          cp -r node_modules/svg-pan-zoom/dist/* vendor_node_modules/svg-pan-zoom/dist/

      # 4. Setup Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 5. Jekyll baut die Seite, nimmt dist samt ZIP-Datei und den temporären Ordner gemäß _config.yml mit
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # 6. Ordner im geschützten _site-Verzeichnis mittels sudo umbenennen
      # Damit stimmen die HTML-Pfade der Live-Webseite wieder.
      - name: Rename vendor folder to node_modules in final site
        run: |
          sudo mv _site/vendor_node_modules _site/node_modules

      # 7. Das fertige Paket hochladen
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
