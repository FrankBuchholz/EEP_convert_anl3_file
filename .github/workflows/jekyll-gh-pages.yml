# Sample workflow for building and deploying a Jekyll site with Node.js dependencies to GitHub Pages
name: Deploy Jekyll with Node.js and GitHub Pages dependencies

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Node.js Umgebung einrichten
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Oder deine gewünschte Node-Version
          cache: 'npm'       # Aktiviert automatisches Caching für schnellere Builds

      # 2. Node-Abhängigkeiten installieren und Build-Skript ausführen
      - name: Install dependencies and build assets
        run: |
          npm ci
          #npm run build # Erstellt die Dateien im dist-Ordner (bei diesem Projekt nicht erforderlich)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 3. Jekyll baut die Seite und nimmt den dist-Ordner automatisch mit
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # 3. Nur die benötigten node_modules direkt in den fertigen Jekyll-Ordner injizieren
      - name: Inject required node_modules into final site
        run: |
          # Zielordner innerhalb des fertigen Jekyll-Builds erstellen
          mkdir -p _site/node_modules/toolwindow/dist
          mkdir -p _site/node_modules/tablefilter/dist/tablefilter
          mkdir -p _site/node_modules/svg-pan-zoom/dist
          
          # Dateien exakt in die erwartete Struktur kopieren
          cp -r node_modules/toolwindow/dist/* _site/node_modules/toolwindow/dist/
          cp -r node_modules/tablefilter/dist/tablefilter/* _site/node_modules/tablefilter/dist/tablefilter/
          cp -r node_modules/svg-pan-zoom/dist/* _site/node_modules/svg-pan-zoom/dist/

      # 4. Das fertige Paket (inklusive der injizierten Module) hochladen
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
