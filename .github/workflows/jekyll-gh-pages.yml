# Sample workflow for building and deploying a Jekyll site with Node.js dependencies to GitHub Pages
name: Deploy Jekyll with Node.js and GitHub Pages dependencies

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 1. Abhängigkeiten installieren und App bauen
      - name: Install dependencies and build assets
        run: |
          npm ci
          #npm run build (bei diesem Projekt nicht nötig)

      # 2. Struktur in einem temporären Ordner vorbereiten
      - name: Prepare node_modules files
        run: |
          mkdir -p vendor_node_modules/toolwindow/dist
          mkdir -p vendor_node_modules/tablefilter/dist/tablefilter
          mkdir -p vendor_node_modules/svg-pan-zoom/dist
          
          cp -r node_modules/toolwindow/dist/* vendor_node_modules/toolwindow/dist/
          cp -r node_modules/tablefilter/dist/tablefilter/* vendor_node_modules/tablefilter/dist/tablefilter/
          cp -r node_modules/svg-pan-zoom/dist/* vendor_node_modules/svg-pan-zoom/dist/

      # 3. Setup Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 4. Jekyll baut die Seite und nimmt den temporären Ordner mit auf
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # 5. Mit Admin-Rechten (sudo) den Ordner im fertigen Build in 'node_modules' umbenennen
      - name: Rename vendor folder to node_modules in final site
        run: |
          sudo mv _site/vendor_node_modules _site/node_modules

      # 6. Das fertige Paket hochladen
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3