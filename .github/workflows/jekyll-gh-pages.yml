# Combined workflow: Build site, inject node_modules, create ZIP, and deploy to Pages
# see corresponding file _config.yml in root the directory
name: Deploy Jekyll with Node dependencies and ZIP download

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 1. Abhängigkeiten der node-Pakete installieren und App bauen
      - name: Install dependencies and build assets
        run: |
          npm ci
          #npm run build (bei diesem Projekt nicht nötig)

      # 2. Struktur in einem temporären Ordner vorbereiten, da Jekyll das Verzeichnis node_modules ignoriert
      - name: Prepare node_modules files
        run: |
          mkdir -p vendor_node_modules/toolwindow/dist
          mkdir -p vendor_node_modules/tablefilter/dist/tablefilter
          mkdir -p vendor_node_modules/svg-pan-zoom/dist
          
          cp -r node_modules/toolwindow/dist/* vendor_node_modules/toolwindow/dist/
          cp -r node_modules/tablefilter/dist/tablefilter/* vendor_node_modules/tablefilter/dist/tablefilter/
          cp -r node_modules/svg-pan-zoom/dist/* vendor_node_modules/svg-pan-zoom/dist/

      # 3. Setup Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 4. Jekyll baut die Seite und nimmt den temporären Ordner gemäß _config.yml mit auf
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # 5. Ordner umbenennen, Download-Verzeichnis erstellen und präzises ZIP-Archiv generieren
      - name: Rename vendor folder and create precise ZIP archive
        run: |
          # 1. Ordner in die finale Struktur für GitHub Pages bringen
          sudo mv _site/vendor_node_modules _site/node_modules
          
          # 2. Ordner für den Web-Download innerhalb von GitHub Pages erstellen
          mkdir -p _site/downloads
          
          # 3. Dein gewohnter Zip-Befehl (erweitert um die 3 node_modules Ordner)
          # Wir speichern das ZIP-Archiv direkt im downloads-Ordner von GitHub Pages
          zip -r _site/downloads/EEP_convert_anl3_file.zip \
            EEP_Gleisplan.html \
            EEP_Inventar.html \
            EEP_Export_Bridge.html \
            EEP_Signale.html \
            EEP_blockControl.html \
            js/ \
            css/ \
            Lua/ \
            images/ \
            WebServer/ \
            README.md \
            EEP_Export_Bridge.md \
            node_modules/toolwindow/dist/ \
            node_modules/tablefilter/dist/tablefilter/ \
            node_modules/svg-pan-zoom/dist/

      # 6. Das fertige Paket hochladen
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
